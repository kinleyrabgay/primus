name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    verify:
        name: Lint, build & test
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9.6.0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check formatting
              run: pnpm format:check

            # NOTE: `pnpm lint` is currently disabled in CI. `ng lint` needs the
            # `@angular-eslint/builder` package (not installed) and `eslint.config.js`
            # is still in legacy (.eslintrc) format, incompatible with ESLint 9's flat
            # config. Re-enable this step once the ESLint config is migrated to flat config.
            # - name: Lint
            #   run: pnpm lint

            - name: Check component registry is up to date
              run: node cli/build-registry.mjs --check

            - name: Build library
              run: pnpm build

            - name: Run unit tests
              run: pnpm test
